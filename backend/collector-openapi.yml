          minLength: 1
        description:
          description: A brief description of the collection.
          type: string
          minLength: 1
        visibility:
          description: >-
            Settings to control who can view the collection (public, private,
            shared with specific users).
          type: string
          enum:
            - PRIVATE
            - PUBLIC
      additionalProperties: false
    CollectionsResponse:
      title: CollectionsResponse
      description: A array with all collections of a user.
      type: object
      required:
        - collections
        - nextKey
      properties:
        collections:
          type: array
          items:
            type: object
            properties:
              collectionId:
                type: string
                format: uuid
              userId:
                type: string
                format: uuid
              lastModified:
                type: string
                format: date-time
              createdAt:
                type: string
                format: date-time
              name:
                description: >-
                  The name of the collection (e.g., "Science Fiction Books",

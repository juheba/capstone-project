    CollectionResponse:
      title: CollectionResponse
      description: A collection of a user.
      type: object
      properties:
        collection:
          type: object
          properties:
            collectionId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            lastModified:

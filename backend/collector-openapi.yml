              type: string
              enum:
                - PRIVATE
                - PUBLIC
      additionalProperties: false
    CollectionItemsResponse:
      title: CollectionItemsResponse
      description: A array with all items of a collection.
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: string
                format: uuid
              title:
                description: >-
                  The title of the item (e.g., the name of the book, movie, or
                  comic).
                type: string
                minLength: 1
              description:
                description: A brief description or summary of the item.
                type: string
                minLength: 1
              itemType:
                description: The type of the item (e.g., book, movie, game, comic).
                type: string
                minLength: 1
              userId:
                type: string
                format: uuid
              addedAt:
                type: string
                format: date-time
              lastModified:
                type: string
                format: date-time
              attachmentUrl:
                description: >-
                  A upload url to attach a file to an item or location depending
                  on the request parameter.
                type: string
                format: url
                minLength: 1
              locationId:
                description: A physical location where the item is stored.
                type: string
                format: uuid
              isLendable:
                description: >-
                  Information about whether the user (owner) would lend the
                  item.
                type: boolean
              ownershipStatus:
                description: >-
                  Information about whether the user owns the item, wishes to
                  buy it, has borrowed it, etc.
                type: string
                enum:
                  - OWNER
                  - BORROWER
                  - WISHLIST
              status:
                description: >-
                  Information about whether the item has been read/watched, is
                  currently being read/watched, or is on a to-read/to-watch
                  list.
                type: string
                enum:
                  - TODO
                  - PROCESSING
                  - DONE

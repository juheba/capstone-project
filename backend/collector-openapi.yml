openapi: 3.0.0
components:
  schemas:
    CreateAttatchmentRequest:
      title: CreateAttatchmentRequest
      description: Creates a attatchment upload url.
      type: object
      properties:
        itemId:
          description: >-
            Creates a upload url to attach a file to an item. If itemId is
            provided, then locationId is unnessary.
          type: string
        locationId:
          description: >-
            Creates a upload url to attach a file to an location. If locationId
            is provided, then itemId is unnessary.
          type: string
      anyOf:
        - required:
            - itemIds
        - required:
            - locationId
      not:
        required:
          - itemIds
          - locationId
      additionalProperties: false
    AttatchmentURLResponse:
      title: AttatchmentURLResponse
      description: Creates a attatchment upload url.
      required:
        - uploadUrl
      type: object
      properties:
        uploadUrl:
          description: >-
            A upload url to attach a file to an item or location depending on
            the request parameter.
          type: string
          minLength: 1
      additionalProperties: false
    CreateCollectionRequest:
      title: CreateCollectionRequest
      description: Stores information about the items in each user's collection.
      required:
        - name
        - visibility
      type: object
      properties:
        name:
          description: >-
            The name of the collection (e.g., "Science Fiction Books", "Marvel
            Movies").
          type: string
          minLength: 1
        description:
          description: A brief description of the collection.
          type: string
          minLength: 1
        visibility:
          description: >-
            Settings to control who can view the collection (public, private,
            shared with specific users).
          type: string
          enum:
            - PRIVATE
            - PUBLIC
      additionalProperties: false
    UpdateCollectionRequest:
      title: UpdateCollectionRequest
      description: Stores information about the items in each user's collection.
      required:
        - name
        - visibility
      type: object
      properties:
        name:

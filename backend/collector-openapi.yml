openapi: 3.0.0
components:
  schemas:
    CreateAttachmentRequest:
      title: CreateAttachmentRequest
      description: Creates an attachment upload URL.
      type: object
      properties:
        itemId:
          description: >-
            Creates an upload URL to attach a file to an item. If itemId is
            provided, locationId is unnecessary.
          type: string
          format: uuid
        locationId:
          description: >-
            Creates an upload URL to attach a file to a location. If locationId
            is provided, itemId is unnecessary.
          type: string
          format: uuid
      anyOf:
        - properties:
            itemId:
              type: string
              minLength: 1
          required:
            - itemId
        - properties:
            locationId:
              type: string
              minLength: 1
          required:
            - locationId
      additionalProperties: false
    AttachmentURLResponse:
      title: AttachmentURLResponse
      description: Creates a attachment upload url.
      required:
        - uploadUrl
      type: object
      properties:
        uploadUrl:
          description: >-
            A upload url to attach a file to an item or location depending on
            the request parameter.
          type: string
          minLength: 1
      additionalProperties: false
    Collection:
      title: Collection
      description: A collection of a user.
      type: object
      required:
        - collectionId
        - userId
        - lastModified
        - createdAt
        - name
        - visibility
      properties:
        collectionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        lastModified:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        name:
          description: >-
            The name of the collection (e.g., "Science Fiction Books", "Marvel
            Movies").
          type: string
          minLength: 1
        description:
          description: A brief description of the collection.
          type: string
          minLength: 1
        visibility:
          description: >-
            Settings to control who can view the collection (public, private,
            shared with specific users).
          type: string
          enum:
            - PRIVATE
            - PUBLIC
      additionalProperties: false
    CreateCollectionRequest:
      title: CreateCollectionRequest
      description: Stores information about the items in each user's collection.
      required:
        - name
        - visibility
      type: object
      properties:
        name:
          description: >-
            The name of the collection (e.g., "Science Fiction Books", "Marvel
            Movies").
          type: string
          minLength: 1
        description:
          description: A brief description of the collection.
          type: string
          minLength: 1
        visibility:
          description: >-
            Settings to control who can view the collection (public, private,
            shared with specific users).
          type: string
          enum:
            - PRIVATE
            - PUBLIC
      additionalProperties: false
    UpdateCollectionRequest:
      title: UpdateCollectionRequest
      description: Stores information about the items in each user's collection.
      required:
        - name
        - visibility
      type: object
      properties:
        name:
          description: >-
            The name of the collection (e.g., "Science Fiction Books", "Marvel
            Movies").
          type: string
          minLength: 1
        description:
          description: A brief description of the collection.
          type: string
          minLength: 1
        visibility:
          description: >-
            Settings to control who can view the collection (public, private,
            shared with specific users).
          type: string
          enum:
            - PRIVATE
            - PUBLIC
      additionalProperties: false
    CollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        nextKey:
          type: string
          nullable: true
      required:
        - collections
    CollectionResponse:
      type: object
      properties:
        collection:
          $ref: '#/components/schemas/Collection'
      required:
        - collection
    CollectionItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        nextKey:
          type: string
          nullable: true
      required:
        - items
    Item:
      title: Item
      description: >-
        Stores information about each item that can be part of a user's
        collection.
      required:
        - itemId
        - title
        - userId
        - addedAt
        - lastModified
        - isLendable
        - ownershipStatus
        - status
      type: object
      properties:
        itemId:
          type: string
          format: uuid
        title:
          description: The title of the item (e.g., the name of the book, movie, or comic).
          type: string
          minLength: 1
        description:
          description: A brief description or summary of the item.
          type: string
          minLength: 1
        itemType:
          description: The type of the item (e.g., book, movie, game, comic).
          type: string
          minLength: 1
        userId:
          type: string
          format: uuid
        addedAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        attachmentUrl:
          description: >-
            A upload url to attach a file to an item or location depending on
            the request parameter.
          type: string
          format: url
          minLength: 1
        locationId:
          description: A physical location where the item is stored.
          type: string
          format: uuid
        isLendable:
          description: Information about whether the user (owner) would lend the item.
          type: boolean
        ownershipStatus:
          description: >-
            Information about whether the user owns the item, wishes to buy it,
            has borrowed it, etc.
          type: string
          enum:
            - OWNER
            - BORROWER
            - WISHLIST
        status:
          description: >-
            Information about whether the item has been read/watched, is
            currently being read/watched, or is on a to-read/to-watch list.
          type: string
          enum:
            - TODO
            - PROCESSING
            - DONE
      additionalProperties: false
    CreateItemRequest:

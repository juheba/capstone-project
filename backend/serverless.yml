org: juheba
app: collector-app
service: collector-app

frameworkVersion: '3'

plugins:
  - serverless-webpack
  - serverless-iam-roles-per-function
  - serverless-plugin-tracing
  - serverless-aws-documentation
  - serverless-offline
  - serverless-dynamodb-local
  - serverless-openapi-documenter

package:
  individually: true
  excludeDevDependencies: true
  exclude:
    - .dynamodb/**
    - node_modules/aws-sdk/** # AWS SDK is already available in the Lambda environment
    - tests/**
    - .git/**
    - .serverless/**
    - serverless/**
    - .vscode/**
    - .idea/**
    - README.md
    - tslint.json

custom:
  webpack:
    webpackConfig: './webpack.config.js'
    concurrency: 5 # Parallelize the build process for multiple functions, defaults to the number of available cores
    includeModules: true # Ensures that required modules are included in the bundle
    packager: 'npm'
    excludeFiles: '**/*.test.ts' # Exclude test files from the bundle
  documentation: ${file(serverless/serverless.doc.yml):documentation}
  serverless-offline:
    httpPort: 3003
  dynamodb:
    # Skipping start: DynamoDB Local is not available for stage: dev
    # We need to whitelist the stage, so that dynamodb is started locally.
    start:
      port: 8000
      inMemory: true
      migrate: true
    stages:
      - dev # whitelist dev-stage
      # ${self:provider.stage}  # whitelists all stages

provider:
  name: aws
  runtime: nodejs18.x

  stage: ${opt:stage, 'dev'}
  region: ${opt:region, "eu-central-1"} # "Value is not accepted." ignore this squiggly line. The Serverless IDE Plugins validation feature can't recognise the value.

  #  tracing: true
  tracing:
    lambda: true
    apiGateway: true

  environment:
    REGION: ${self:provider.region}
    STAGE: ${self:provider.stage}
    AUTH_0_SECRET_ID: Auth0Secret-${self:provider.stage}
    AUTH_0_SECRET_FIELD: auth0Secret
    COLLECTION_TABLE: ${self:app}-collection-${self:provider.stage}
    COLLECTION_CREATED_AT_INDEX: CollectionCreatedAtIndex
    ITEM_TABLE: ${self:app}-item-${self:provider.stage}
    ITEM_CREATED_AT_INDEX: ItemCreatedAtIndex
    COLLECTION_ITEM_TABLE: ${self:app}-collection-item-${self:provider.stage}
    COLLECTION_ITEM_INDEX: CollectionItemIndex
    LOCATION_TABLE: ${self:app}-location-${self:provider.stage}
    LOCATION_ADDED_AT_INDEX: LocationAddedAtIndex
    ATTACHMENTS_S3_BUCKET: ${self:org}-${self:app}-attachments-${self:provider.stage}
    SIGNED_URL_EXPIRATION: 300
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
    NODE_OPTIONS: '--enable-source-maps --stack-trace-limit=1000'

  logs:
    # Enable API Gateway logs
    restApi: true

functions:
  - ${file(serverless/functions/auth.yml)}
  - ${file(serverless/functions/collection.yml)}
  - ${file(serverless/functions/item.yml)}
  - ${file(serverless/functions/location.yml)}
  - ${file(serverless/functions/attachment.yml)}

resources: ${file(serverless/ressources.yml)}
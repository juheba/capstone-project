documentation:
  api:
    info:
      version: &version v.0.0.0
      title: &title Collector API
      description: &description Serverless application for collection management
  version: *version
  title: *title
  description: *description
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  tags:
    - name: attatchment
      description: Operations on attatchments
    - name: collection
      description: Operations on collections
    - name: item
      description: Operations on items
    - name: location
      description: Operations on locations
  models:
    # Attatchment
    - name: CreateAttatchmentRequest
      contentType: application/json
      schema: ${file(schemas/attachment/create-attatchment-request.json)}
    - name: AttatchmentURLResponse
      contentType: application/json
      schema: ${file(schemas/attachment/attatchment-url-response.json)}

    # Collection
    - name: CreateCollectionRequest
      contentType: application/json
      schema: ${file(schemas/collection/create-collection-request.json)}
    - name: UpdateCollectionRequest
      contentType: application/json
      schema: ${file(schemas/collection/update-collection-request.json)}
    - name: CollectionsResponse
      contentType: application/json
      schema: ${file(schemas/collection/collections-response.json)}
    - name: CollectionResponse
      contentType: application/json
      schema: ${file(schemas/collection/collection-response.json)}
    - name: CollectionItemsResponse
      contentType: application/json
      schema: ${file(schemas/collection/collection-items-response.json)}

    # Item
    - name: CreateItemRequest
      contentType: application/json
      schema: ${file(schemas/item/create-item-request.json)}
    - name: UpdateItemRequest
      contentType: application/json
      schema: ${file(schemas/item/update-item-request.json)}
    - name: ItemsResponse
      contentType: application/json
      schema: ${file(schemas/item/items-response.json)}
    - name: ItemResponse
      contentType: application/json
      schema: ${file(schemas/item/item-response.json)}
    - name: ItemCollectionsResponse
      contentType: application/json
      schema: ${file(schemas/item/item-collections-response.json)}

    # Location
    - name: CreateLocationRequest
      contentType: application/json
      schema: ${file(schemas/location/create-location-request.json)}
    - name: UpdateLocationRequest
      contentType: application/json
      schema: ${file(schemas/location/update-location-request.json)}
    - name: LocationsResponse
      contentType: application/json
      schema: ${file(schemas/location/locations-response.json)}
    - name: LocationResponse
      contentType: application/json
      schema: ${file(schemas/location/location-response.json)}

    # CollectionItems
    - name: UpdateCollectionItemsRequest
      contentType: application/json
      schema: ${file(schemas/update-collection-items-request.json)}

    # ErrorResponse
    - name: ErrorResponse
      contentType: application/json
      schema: ${file(schemas/error-response.json)}

endpoints:
## Attatchment ##
  GenerateUploadUrl:
    summary: Generates an attatchment upload url
    description: Generates an upload url for an item or location attatchment
    tags:
      - attatchment
    security:
      - bearerAuth: []  # No scopes required
    requestBody:
      description: Item or Location to attach a file to.
    requestModels:
      application/json: CreateAttatchmentRequest
    responseBody:
      description: The upload url
    methodResponses:
      - statusCode: "201"
        responseBody:
          description: The created url to upload a file.
        responseModels:
          application/json: AttatchmentURLResponse
      - statusCode: "400"
        responseBody:
          description: &400Description Bad Request - message with additional information.
        responseModels:
          application/json: ErrorResponse
      - statusCode: "401"
        responseBody:
          description: &401Description Unauthorized - user is not logged in or authorization failed.
        responseModels:
          application/json: ErrorResponse
      - statusCode: "404"
        responseBody:
          description: &404Description Not Found - message with additional information what wasn't found.
        responseModels:
          application/json: ErrorResponse
      - statusCode: "500"
        responseBody:
          description: &500Description Internal Server Error - message with additional information.
        responseModels:
          application/json: ErrorResponse


documentation:
  api:
    info:
      version: &version v.0.0.0
      title: &title Collector API
      description: &description Serverless application for collection management
  version: *version
  title: *title
  description: *description
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  tags:
    - name: attachment
      description: Operations on attachments
    - name: collection
      description: Operations on collections
    - name: item
      description: Operations on items
    - name: location
      description: Operations on locations
  models:
    # Attachment
    - name: CreateAttachmentRequest
      contentType: application/json
      schema: ${file(schemas/attachment/create-attachment-request.json)}
    - name: AttachmentURLResponse
      contentType: application/json
      schema: ${file(schemas/attachment/attachment-url-response.json)}

    # Collection
    - name: Collection
      contentType: application/json
      schema: &Collection ${file(schemas/collection/collection-model.json)}
    - name: CreateCollectionRequest
      contentType: application/json
      schema: ${file(schemas/collection/create-collection-request.json)}
    - name: UpdateCollectionRequest
      contentType: application/json
      schema: ${file(schemas/collection/update-collection-request.json)}
    - name: CollectionsResponse
      contentType: application/json
      description: A list with collections of a user and a 'nextKey' if there are more.
      schema:
        type: object
        properties:
          collections:
            type: array
            items: *Collection
          nextKey:
            type:
             - string
             - 'null'
        required:
          - collections
    - name: CollectionResponse
      contentType: application/json
      description: A collection of a user.
      schema:
        type: object
        properties:
          collection: *Collection
        required:
          - collection

    # Item
    - name: Item
      contentType: application/json
      schema: &Item ${file(schemas/item/item-model.json)}
    - name: CreateItemRequest
      contentType: application/json
      schema: ${file(schemas/item/create-item-request.json)}
    - name: UpdateItemRequest
      contentType: application/json
      schema: ${file(schemas/item/update-item-request.json)}
    - name: ItemsResponse
      contentType: application/json
      description: A list with items of a user and a 'nextKey' if there are more.
      schema:
        type: object
        properties:
          items:
            type: array
            items: *Item
          nextKey:
            type:
             - string
             - 'null'
        required:
          - items
    - name: ItemResponse
      contentType: application/json
      description: Stores information about each item that can be part of a user's collection.
      schema:
        type: object
        properties:
          item: *Item
        required:
          - item

    # CollectionItems: Multiple items in a collection
    - name: CollectionItemsResponse
      contentType: application/json
      description: A list with items that are assigned to a specific collection.
      schema:
        type: object
        properties:
          items:
            type: array
            items: *Item
          nextKey:
            type:
             - string
             - 'null'
        required:
          - items
    
    # ItemCollections: Multiple collections for an item
    - name: ItemCollectionsResponse
      contentType: application/json
      description: A list with collections that are assigned to a specific item.
      schema:
        type: object
        properties:
          collections:
            type: array
            items: *Collection
        required:
          - collections

    # Location
    - name: Location
      contentType: application/json
      schema: &Location ${file(schemas/location/location-model.json)}
    - name: CreateLocationRequest
      contentType: application/json
      schema: ${file(schemas/location/create-location-request.json)}
    - name: UpdateLocationRequest
      contentType: application/json
      schema: ${file(schemas/location/update-location-request.json)}
    - name: LocationsResponse
      contentType: application/json
      description: A list with locations of a user and a 'nextKey' if there are more.
      schema:
        type: object
        properties:
          locations:
            type: array
            items: *Location
          nextKey:
            type:
             - string
             - 'null'
        required:
          - locations
    - name: LocationResponse
      contentType: application/json
      description: Represents a physical location where collection items can be stored.
      schema:
        type: object
        properties:
          location: *Location
        required:
          - location

    # CollectionItems
    - name: UpdateCollectionItemsRequest
      contentType: application/json
      schema: ${file(schemas/update-collection-items-request.json)}

    # ErrorResponse
    - name: ErrorResponse
      contentType: application/json
      schema: &ErrorResponse ${file(schemas/error-response.json)}
    - name: BadRequestErrorResponse
      title: BadRequestErrorResponse
      description: &Description400 Bad Request - message with additional information.
      contentType: application/json
      schema: *ErrorResponse
      examples:
        - name: BadRequestExample
          summary: 400 Bad Request error
          description: An example of an 400 Bad Request error
          value: '{"statusCode": 400, "errorCode": "T123", "message": "Bad Request - some value is missing."}'
    - name: UnauthorizedErrorResponse
      description: &Description401 Unauthorized - user is not logged in or authorization failed.
      contentType: application/json
      schema: *ErrorResponse
      examples:
        - name: UnauthorizedExample
          summary: 401 Unauthorized
          description: An example of an 401 Unauthorized error
          value: '{"statusCode": 401, "errorCode": "T123", "message": "Unauthorized - user is not logged in or authorization failed."}'
    - name: NotFoundErrorResponse
      description: &Description404 Not Found - message with additional information what wasn't found.
      contentType: application/json
      schema: *ErrorResponse
      examples:
        - name: NotFoundExample
          summary: 404 Not Found error
          description: An example of an 404 Not Found error
          value: '{"statusCode": 404, "errorCode": "T123", "message": "Not Found - the requested resource does not exist."}'
    - name: InternalServerErrorResponse
      description: &Description500 Internal Server Error - message with additional information.
      contentType: application/json
      schema: *ErrorResponse
      examples:
        - name: InternalServerErrorExample
          summary: 500 Internal Server error
          description: An example of an 500 Internal Server error
          value: '{"statusCode": 500, "errorCode": "T123", "message": "Internal Server - something went horrably wrong."}'


endpoints:
## Attachment ##
  GenerateUploadUrl:
    summary: Generates an attachment upload url
    description: Generates an upload url for an item or location attachment
    tags:
      - attachment
    security:
      - bearerAuth: []  # No scopes required
    requestBody:
      description: Item or Location to attach a file to.
    requestModels:
      application/json: CreateAttachmentRequest
    responseBody:
      description: The upload url
    methodResponses:
      - statusCode: "201"
        responseBody:
          description: The created url to upload a file.
        responseModels:
          application/json: AttachmentURLResponse
      - statusCode: "400"
        responseBody:
          description: *Description400
        responseModels:
          application/json: BadRequestErrorResponse
      - statusCode: "401"
        responseBody:
          description: *Description401
        responseModels:
          application/json: UnauthorizedErrorResponse
      - statusCode: "404"
        responseBody:
          description: *Description404
        responseModels:
          application/json: NotFoundErrorResponse
      - statusCode: "500"
        responseBody:
          description: *Description500
        responseModels:
          application/json: InternalServerErrorResponse

## Collectons ##

  GetCollections:
    summary: Get all collections
    description: Get all collections of a user
    tags:
      - collection
    security:
      - bearerAuth: []  # No scopes required
    queryParams:

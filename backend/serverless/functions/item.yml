        - dynamodb:UpdateItem
        - xray:PutTelemetryRecords
        - xray:PutTraceSegments
      Resource: 'arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ITEM_TABLE}'

DeleteItem:
  tracing: true
  handler: src/lambda/http/item/deleteItem.main
  events:
    - http:
        method: delete
        path: items/{itemId}
        cors: true
        authorizer: Auth
        documentation: ${file(./serverless/serverless.doc.yml):endpoints.DeleteItem}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:DeleteItem
        - xray:PutTelemetryRecords
        - xray:PutTraceSegments
      Resource: 'arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ITEM_TABLE}'

GetItemCollections:
  tracing: true
  handler: src/lambda/http/item/getItemCollections.main
  events:
    - http:
        method: get
        path: items/{itemId}/collections
        cors: true
        authorizer: Auth
        documentation: ${file(./serverless/serverless.doc.yml):endpoints.GetItemCollections}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - xray:PutTelemetryRecords
        - xray:PutTraceSegments
      Resource:
        - 'arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.COLLECTION_ITEM_TABLE}'
        - 'arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.COLLECTION_ITEM_TABLE}/index/${self:provider.environment.COLLECTION_ITEM_INDEX}'
    - Effect: Allow
      Action:
        - dynamodb:BatchGetItem
        - xray:PutTelemetryRecords
        - xray:PutTraceSegments
      Resource:
        - 'arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.COLLECTION_TABLE}'

UpdateItemCollections:
  tracing: true
  handler: src/lambda/http/item/updateItemCollections.main
  events:
    - http:
        method: post
        path: items/{itemId}/collections
        cors: true
        authorizer: Auth
        documentation: ${file(./serverless/serverless.doc.yml):endpoints.UpdateItemCollections}
        request:
          schemas:
            application/json: ${file(./schemas/update-collection-items-request.json)}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:BatchWriteItem
        - xray:PutTelemetryRecords
        - xray:PutTraceSegments
      Resource:
        - 'arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.COLLECTION_ITEM_TABLE}'
        - 'arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.COLLECTION_ITEM_TABLE}/index/${self:provider.environment.COLLECTION_ITEM_INDEX}'
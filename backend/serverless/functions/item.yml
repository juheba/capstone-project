GetItems:
  tracing: true
  handler: src/lambda/http/item/getItems.main
  events:
    - http:
        method: get
        path: items
        cors: true
        authorizer: Auth
        documentation: ${file(./serverless/serverless.doc.yml):endpoints.GetItems}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - xray:PutTelemetryRecords
        - xray:PutTraceSegments
      Resource: 'arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ITEM_TABLE}'

GetItem:
  tracing: true
  handler: src/lambda/http/item/getItem.main
  events:
    - http:
        method: get
        path: items/{itemId}
        cors: true
        authorizer: Auth
        documentation: ${file(./serverless/serverless.doc.yml):endpoints.GetItem}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - xray:PutTelemetryRecords
        - xray:PutTraceSegments
      Resource: 'arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ITEM_TABLE}'

CreateItem:
  tracing: true
  handler: src/lambda/http/item/createItem.main
  events:
    - http:
        method: post
        path: items
        cors: true
        authorizer: Auth
        documentation: ${file(./serverless/serverless.doc.yml):endpoints.CreateItem}
        request:
          schemas:
            application/json: ${file(./schemas/item/create-item-request.json)}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - xray:PutTelemetryRecords
        - xray:PutTraceSegments
      Resource: 'arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ITEM_TABLE}'

UpdateItem:
  tracing: true
  handler: src/lambda/http/item/updateItem.main
  events:
    - http:
        method: patch
        path: items/{itemId}
        cors: true
        authorizer: Auth
        documentation: ${file(./serverless/serverless.doc.yml):endpoints.UpdateItem}
        request:
          schemas:
            application/json: ${file(./schemas/item/update-item-request.json)}
  iamRoleStatements:
    - Effect: Allow

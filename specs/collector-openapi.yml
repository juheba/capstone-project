##################
###   MODELS   ###
##################
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    # IDs
    UserId:
      description: The id of the user.
      type: string
      format: uuid
    CollectionId:
      description: The id of the collection.
      type: string
      format: uuid
    ItemId:
      description: The id of the item.
      type: string
      format: uuid
    LocationId:
      description: The id of the location.
      type: string
      format: uuid

    # Pagination
    Limit:
      description: The number of entries to return.
      type: number
      format: int64
    NextKey:
      description: The next key to be used for pagination.
      type: string

    # Enums
    CollectionVisibilityEnum:
      description: >-
        Settings to control who can view the collection (public, private,
        shared with specific users).
      type: string
      enum:
        - PRIVATE
        - PUBLIC
    ItemOwnershipStatusEnum:
      description: >-
        Information about whether the user owns the item, wishes to buy it,
        has borrowed it, etc.
      type: string
      enum:
        - OWNER
        - BORROWER
        - WISHLIST
    ItemStatusEnum:
      description: >-
        Information about whether the item has been read/watched, is
        currently being read/watched, or is on a to-read/to-watch list.
      type: string
      enum:
        - TODO
        - PROCESSING
        - DONE

    # Attachment
    AttachmentUrl:
      description: >-
        A upload url to attach a file to an item or location depending on
        the request parameter.
      type: string
      format: url
      minLength: 1
    CreateAttachmentRequest:
      title: CreateAttachmentRequest
      description: Creates an attachment upload URL.
      type: object
      properties:
        itemId:
          description: >-
            Creates an upload URL to attach a file to an item. If itemId is
            provided, locationId is unnecessary.
          type: string
          format: uuid
        locationId:
          description: >-
            Creates an upload URL to attach a file to a location. If locationId
            is provided, itemId is unnecessary.
          type: string
          format: uuid
      anyOf:
        - properties:
            itemId:
              $ref: '#/components/schemas/ItemId'
          required:
            - itemId
        - properties:
            locationId:
              $ref: '#/components/schemas/LocationId'
          required:
            - locationId
      additionalProperties: false
    AttachmentURLResponse:
      title: AttachmentURLResponse
      description: Creates a attachment upload url.
      required:
        - uploadUrl
      type: object
      properties:
        uploadUrl:
          $ref: '#/components/schemas/AttachmentUrl'
      additionalProperties: false

    # Collections
    Collection:
      title: Collection
      description: A collection of a user.
      type: object
      required:
        - collectionId
        - userId
        - lastModified
        - createdAt
        - name
        - visibility
      properties:
        collectionId:
          $ref: '#/components/schemas/CollectionId'
        userId:
          $ref: '#/components/schemas/UserId'
        lastModified:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        name:
          description: >-
            The name of the collection (e.g., "Science Fiction Books", "Marvel
            Movies").
          type: string
          minLength: 1
        description:
          description: A brief description of the collection.
          type: string
          minLength: 1
        visibility:
          $ref: '#/components/schemas/CollectionVisibilityEnum'
      additionalProperties: false
    CreateCollectionRequest:
      title: CreateCollectionRequest
      description: Stores information about the items in each user's collection.
      required:
        - name
        - visibility
      type: object
      properties:
        name:
          description: >-
            The name of the collection (e.g., "Science Fiction Books", "Marvel
            Movies").
          type: string
          minLength: 1
        description:
          description: A brief description of the collection.
          type: string
          minLength: 1
        visibility:
          $ref: '#/components/schemas/CollectionVisibilityEnum'
      additionalProperties: false
    UpdateCollectionRequest:
      title: UpdateCollectionRequest
      description: Stores information about the items in each user's collection.
      required:
        - name
        - visibility
      type: object
      properties:
        name:
          description: >-
            The name of the collection (e.g., "Science Fiction Books", "Marvel
            Movies").
          type: string
          minLength: 1
        description:
          description: A brief description of the collection.
          type: string
          minLength: 1
        visibility:
          $ref: '#/components/schemas/CollectionVisibilityEnum'
      additionalProperties: false
    CollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        nextKey:
          $ref: '#/components/schemas/NextKey'
      required:
        - collections
    CollectionResponse:
      type: object
      properties:
        collection:
          $ref: '#/components/schemas/Collection'
      required:
        - collection
    CollectionItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        nextKey:
          $ref: '#/components/schemas/NextKey'
      required:
        - items

    # Items
    Item:
      title: Item
      description: >-
        Stores information about each item that can be part of a user's
        collection.
      required:
        - itemId
        - title
        - userId
        - addedAt
        - lastModified
        - isLendable
        - ownershipStatus
        - status
      type: object
      properties:
        itemId:
          $ref: '#/components/schemas/ItemId'
        title:
          description: The title of the item (e.g., the name of the book, movie, or comic).
          type: string
          minLength: 1
        description:
          description: A brief description or summary of the item.
          type: string
          minLength: 1
        itemType:
          description: The type of the item (e.g., book, movie, game, comic).
          type: string
          minLength: 1
        userId:
          $ref: '#/components/schemas/UserId'
        addedAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        attachmentUrl:
          $ref: '#/components/schemas/AttachmentUrl'
        locationId:
          $ref: '#/components/schemas/LocationId'
        isLendable:
          description: Information about whether the user (owner) would lend the item.
          type: boolean
        ownershipStatus:
          $ref: '#/components/schemas/ItemOwnershipStatusEnum'
        status:
          $ref: '#/components/schemas/ItemStatusEnum'
      additionalProperties: false
    CreateItemRequest:
      title: CreateItemRequest
      description: >-
        Stores information about each item that can be part of a user's
        collection.
      required:
        - title
        - isLendable
        - ownershipStatus
        - status
      type: object
      properties:
        title:
          description: The title of the item (e.g., the name of the book, movie, or comic).
          type: string
          minLength: 1
        itemType:
          description: The type of the item (e.g., book, movie, game, comic).
          type: string
          minLength: 1
        description:
          description: A brief description or summary of the item.
          type: string
          minLength: 1
        locationId:
          $ref: '#/components/schemas/LocationId'
        isLendable:
          description: Information about whether the user (owner) would lend the item.
          type: boolean
        ownershipStatus:
          $ref: '#/components/schemas/ItemOwnershipStatusEnum'
        status:
          $ref: '#/components/schemas/ItemStatusEnum'
      additionalProperties: false
    UpdateItemRequest:
      title: UpdateItemRequest
      description: >-
        Stores information about each item that can be part of a user's
        collection.
      required:
        - title
        - isLendable
        - ownershipStatus
        - status
      type: object
      properties:
        title:
          description: The title of the item (e.g., the name of the book, movie, or comic).
          type: string
          minLength: 1
        itemType:
          description: The type of the item (e.g., book, movie, game, comic).
          type: string
          minLength: 1
        description:
          description: A brief description or summary of the item.
          type: string
          minLength: 1
        locationId:
          $ref: '#/components/schemas/LocationId'
        isLendable:
          description: Information about whether the user (owner) would lend the item.
          type: boolean
        ownershipStatus:
          $ref: '#/components/schemas/ItemOwnershipStatusEnum'
        status:
          $ref: '#/components/schemas/ItemStatusEnum'
      additionalProperties: false
    ItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        nextKey:
          $ref: '#/components/schemas/NextKey'
      required:
        - items
    ItemResponse:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/Item'
      required:
        - item
    ItemCollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
      required:
        - collections

    # Locations
    Location:
      title: Location
      description: Represents a physical location where collection items can be stored.
      required:
        - locationId
        - name
        - userId
        - addedAt
        - lastModified
      type: object
      properties:
        name:
          description: The name of the location (e.g., Living Room Bookshelf, Storage Box).
          type: string
          minLength: 1
        description:
          description: >-
            A description of the location. Provides users with more information
            about each location.
          type: string
          minLength: 1
        userId:
          $ref: '#/components/schemas/UserId'
        addedAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        attachmentUrl:
          $ref: '#/components/schemas/AttachmentUrl'
        locationId:
          $ref: '#/components/schemas/LocationId'
      additionalProperties: false
    CreateLocationRequest:
      title: CreateLocationRequest
      description: Represents the physical locations where collection items.
      required:
        - name
      type: object
      properties:
        name:
          description: The name of the location (e.g., Living Room Bookshelf, Storage Box).
          type: string
          minLength: 1
        description:
          description: >-
            A description of the location. Provides users with more information
            about each location.
          type: string
          minLength: 1
      additionalProperties: false
    UpdateLocationRequest:
      title: UpdateLocationRequest
      description: Represents the physical locations where collection items.
      required:
        - name
      type: object
      properties:
        name:
          description: The name of the location (e.g., Living Room Bookshelf, Storage Box).
          type: string
          minLength: 1
        description:
          description: >-
            A description of the location. Provides users with more information
            about each location.
          type: string
          minLength: 1
      additionalProperties: false
    LocationsResponse:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        nextKey:
          $ref: '#/components/schemas/NextKey'
      required:
        - locations
    LocationResponse:
      type: object
      properties:
        location:
          $ref: '#/components/schemas/Location'
      required:
        - location
    UpdateCollectionItemsRequest:
      title: UpdateCollectionItemsRequest
      type: object
      properties:
        itemIds:
          type: array
          items:
            $ref: '#/components/schemas/ItemId'
          uniqueItems: true
        collectionIds:
          type: array
          items:
            $ref: '#/components/schemas/CollectionId'
          uniqueItems: true
      anyOf:
        - properties:
            itemIds:
              type: array
              minLength: 1
              items:
                $ref: '#/components/schemas/ItemId'
          required:
            - itemIds
        - properties:
            collectionIds:
              type: array
              minLength: 1
              items:
                $ref: '#/components/schemas/CollectionId'
          required:
            - collectionIds
      additionalProperties: false
    ErrorResponse:
      description: Represents an error.
      required:
        - statusCode
        - errorCode
        - message
      type: object
      properties:
        statusCode:
          description: The http status code.
          type: number
          minimum: 100
          maximum: 599
        errorCode:
          description: An unique error code.
          type: string
          minLength: 1
        message:
          description: Short error message.
          type: string
          minLength: 1
        details:
          description: Additional details about the error (optional).
          type: string
          minLength: 1
      additionalProperties: false

  examples:
    BadRequestExample:
      summary: 400 Bad Request error
      description: An example of an 400 Bad Request error
      value: >-
        {"statusCode": 400, "errorCode": "T123", "message": "Bad Request - some
        value is missing."}
    UnauthorizedExample:
      summary: 401 Unauthorized
      description: An example of an 401 Unauthorized error
      value: >-
        {"statusCode": 401, "errorCode": "T123", "message": "Unauthorized - user
        is not logged in or authorization failed."}
    InternalServerErrorExample:
      summary: 500 Internal Server error
      description: An example of an 500 Internal Server error
      value: >-
        {"statusCode": 500, "errorCode": "T123", "message": "Internal Server -
        something went horrably wrong."}
    NotFoundExample:
      summary: 404 Not Found error
      description: An example of an 404 Not Found error
      value: >-
        {"statusCode": 404, "errorCode": "T123", "message": "Not Found - the
        requested resource does not exist."}